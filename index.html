/* Domésticas 27 — componentes. Lee las variables de tokens.css (--fondo, --vidrio, --finanzas-texto…). */

/* ---------- Acento por app ---------- */
.d-app, [data-app] {
  --acento: var(--finanzas-texto); --acento-relleno: var(--finanzas-relleno); --acento-sobre: var(--finanzas-sobre);
  --acento-hi: var(--finanzas-hi); --acento-lo: var(--finanzas-lo); --acento-brillo: var(--finanzas-brillo);
  --material: var(--vidrio);
}
[data-app="casa"] { --acento: var(--casa-texto); --acento-relleno: var(--casa-relleno); --acento-sobre: var(--casa-sobre); --acento-hi: var(--casa-hi); --acento-lo: var(--casa-lo); --acento-brillo: var(--casa-brillo); }
[data-app="noche"] { --acento: var(--noche-texto); --acento-relleno: var(--noche-relleno); --acento-sobre: var(--noche-sobre); --acento-hi: var(--noche-hi); --acento-lo: var(--noche-lo); --acento-brillo: var(--noche-brillo); }
[data-app="consulta"] { --acento: var(--consulta-texto); --acento-relleno: var(--consulta-relleno); --acento-sobre: var(--consulta-sobre); --acento-hi: var(--consulta-hi); --acento-lo: var(--consulta-lo); --acento-brillo: var(--consulta-brillo); }
[data-app="juegos"] { --acento: var(--juegos-texto); --acento-relleno: var(--juegos-relleno); --acento-sobre: var(--juegos-sobre); --acento-hi: var(--juegos-hi); --acento-lo: var(--juegos-lo); --acento-brillo: var(--juegos-brillo); }

/* Intensidad del vidrio, como el control de iOS 27: «claro» (por defecto) o «tintado». */
[data-vidrio="tintado"] { --material: var(--vidrio-tintado); }

/* ---------- Lienzo de la app ---------- */
.d-app {
  min-height: 100%;
  color: var(--tinta);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(120% 55% at 0% -8%, var(--acento-brillo), transparent 62%),
    radial-gradient(80% 45% at 105% 4%, var(--acento-brillo), transparent 58%),
    var(--fondo);
}

/* ---------- Material de vidrio ---------- */
.d-vidrio {
  position: relative;
  background: var(--material, var(--vidrio));
  -webkit-backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio));
  backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio));
  border-radius: var(--radius-tarjeta);
  box-shadow: var(--sombra-vidrio);
}
/* Borde de luz: reflejo arriba a la izquierda y abajo a la derecha. */
.d-vidrio::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
  background: linear-gradient(155deg, var(--vidrio-brillo), transparent 34%, transparent 70%, var(--vidrio-brillo));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  opacity: .75;
}
@media (prefers-reduced-transparency: reduce) {
  .d-vidrio, .d-barra, .d-cabecera--fija, .d-boton--vidrio, .d-boton-circular { background: var(--superficie); -webkit-backdrop-filter: none; backdrop-filter: none; }
}
@media (prefers-contrast: more) {
  .d-vidrio, .d-barra { background: var(--superficie); box-shadow: 0 0 0 1px var(--tinta-2); }
}

/* ---------- Barra superior ---------- */
.d-cabecera { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-3); padding: var(--space-2) var(--space-4) var(--space-2); }
.d-cabecera h1 { margin: 0; font: 700 34px/41px var(--font-sans); letter-spacing: -0.4px; }
.d-cabecera .d-antetitulo { display: block; font: 600 13px/18px var(--font-sans); color: var(--tinta-2); }
.d-cabecera .d-acciones { display: flex; gap: var(--space-2); }
/* Al pasar contenido por debajo: barra uniforme y esmerilada (comportamiento de iOS 27). */
.d-cabecera--fija {
  position: sticky; top: 0; z-index: 5; align-items: center;
  background: linear-gradient(to bottom, var(--material, var(--vidrio)) 60%, transparent);
  -webkit-backdrop-filter: blur(var(--desenfoque-barra)) saturate(var(--saturacion-vidrio));
  backdrop-filter: blur(var(--desenfoque-barra)) saturate(var(--saturacion-vidrio));
}
.d-cabecera--fija h1 { font-size: 17px; line-height: 22px; letter-spacing: 0; font-weight: 600; }

/* ---------- Botones ---------- */
.d-boton {
  appearance: none; border: 0; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  min-height: 50px; padding: 0 var(--space-6); border-radius: var(--radius-capsula);
  font: 600 17px/22px var(--font-sans); color: var(--acento-sobre); background: var(--acento-relleno);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 20px -8px var(--acento-relleno);
  transition: transform .18s cubic-bezier(.3,.7,.4,1.4);

.d-boton:active { transform: scale(.96); }
.d-boton--vidrio { color: var(--acento); background: var(--material, var(--vidrio)); box-shadow: var(--sombra-vidrio);
  -webkit-backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio)); backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio)); }
.d-boton--discreto { color: var(--acento); background: var(--relleno); box-shadow: none; }
.d-boton--ancho { width: 100%; }
.d-boton-circular {
  appearance: none; border: 0; cursor: pointer; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  color: var(--tinta); background: var(--material, var(--vidrio)); box-shadow: var(--sombra-vidrio);
  -webkit-backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio)); backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio));
}
.d-boton-circular svg, .d-boton svg { width: 20px; height: 20px; }
.d-boton-circular--acento { color: var(--acento-sobre); background: var(--acento-relleno); }
.d-boton:focus-visible, .d-boton-circular:focus-visible, .d-barra button:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }

/* ---------- Tarjeta principal ---------- */
.d-heroe {
  position: relative; overflow: hidden; border-radius: var(--radius-heroe); padding: var(--space-5);
  color: var(--acento-sobre);
  background: linear-gradient(150deg, var(--acento-hi), var(--acento-lo));
  box-shadow: var(--sombra-heroe);
}
.d-heroe::after { /* brillo de vidrio en la esquina */
  content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px; border-radius: 50%;
  background: radial-gradient(circle at 35% 65%, rgba(255,255,255,.34), rgba(255,255,255,0) 62%); pointer-events: none;
}
.d-heroe .d-etiqueta { font: 600 13px/18px var(--font-sans); opacity: .92; }
.d-heroe .d-cifra-grande { display: block; margin-top: var(--space-1); font: 700 44px/48px var(--font-rounded); letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.d-heroe .d-pie { display: flex; gap: var(--space-4); margin-top: var(--space-4); font: 400 15px/20px var(--font-sans); }
.d-heroe .d-pie b { display: block; font: 600 17px/22px var(--font-rounded); }
.d-heroe .d-barra-avance { height: 6px; margin-top: var(--space-4); border-radius: 3px; background: rgba(255,255,255,.28); overflow: hidden; }
.d-heroe .d-barra-avance i { display: block; height: 100%; border-radius: 3px; background: currentColor; }

/* ---------- Lista agrupada ---------- */
.d-seccion { margin: var(--space-6) var(--space-4) var(--space-2); display: flex; justify-content: space-between; align-items: baseline; }
.d-seccion h2 { margin: 0; font: 700 22px/28px var(--font-sans); }
.d-seccion a { color: var(--acento); font: 400 17px/22px var(--font-sans); text-decoration: none; }
.d-lista { margin: 0 var(--space-4); padding: 0; list-style: none; overflow: hidden; }
.d-fila { display: flex; align-items: center; gap: var(--space-3); min-height: 44px; padding: var(--space-3) var(--space-4); position: relative; }
.d-fila + .d-fila::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; height: 0.5px; background: var(--separador); }
.d-fila .d-cuadro { flex: none; width: 30px; height: 30px; border-radius: var(--radius-s); display: grid; place-items: center; color: #fff; background: linear-gradient(150deg, var(--acento-hi), var(--acento-lo)); box-shadow: inset 0 1px 0 rgba(255,255,255,.35); }
.d-fila .d-cuadro svg { width: 18px; height: 18px; }
.d-fila .d-texto { flex: 1; min-width: 0; }
.d-fila .d-texto strong { display: block; font: 400 17px/22px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.d-fila .d-texto span { display: block; font: 400 15px/20px var(--font-sans); color: var(--tinta-2); }
.d-fila .d-valor { font: 600 17px/22px var(--font-rounded); font-variant-numeric: tabular-nums; white-space: nowrap; }
.d-valor--positivo { color: var(--positivo); }
.d-valor--negativo { color: var(--negativo); }

/* ---------- Control segmentado ---------- */
.d-segmentos { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--radius-capsula); background: var(--relleno); }
.d-segmentos button { appearance: none; border: 0; cursor: pointer; padding: 7px 16px; border-radius: var(--radius-capsula); background: transparent; color: var(--tinta); font: 600 13px/18px var(--font-sans); }
.d-segmentos button[aria-pressed="true"] { background: var(--superficie); box-shadow: 0 0 0 .5px var(--vidrio-borde), 0 3px 8px rgba(10,18,40,.12), inset 0 1px 0 var(--vidrio-brillo); }

/* ---------- Barra de pestañas flotante ---------- */
.d-barra-pie { position: sticky; bottom: 0; display: flex; gap: var(--space-2); align-items: center; padding: var(--space-3) var(--space-4) calc(var(--space-5) + env(safe-area-inset-bottom)); }
.d-barra {
  flex: 1; display: flex; padding: 4px; border-radius: var(--radius-capsula);
  background: var(--material, var(--vidrio)); box-shadow: var(--sombra-flotante);
  -webkit-backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio)); backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio));
}
.d-barra button { appearance: none; border: 0; cursor: pointer; flex: 1; display: grid; justify-items: center; gap: 1px; padding: 6px 0 5px; border-radius: var(--radius-capsula); background: transparent; color: var(--tinta); font: 600 10px/12px var(--font-sans); }
.d-barra button svg { width: 24px; height: 24px; }
.d-barra button[aria-current="page"] { color: var(--acento); background: var(--relleno); box-shadow: inset 0 1px 0 var(--vidrio-brillo); }
.d-barra-pie .d-boton-circular { width: 56px; height: 56px; box-shadow: var(--sombra-flotante); }

/* ---------- Anillo de ciclo (gas, filtro, cepillos, cápsula) ---------- */
.d-anillo { --avance: .6; --color: var(--acento); width: 64px; height: 64px; position: relative; display: grid; place-items: center; }
.d-anillo svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.d-anillo .d-pista { stroke: var(--relleno); }
.d-anillo .d-arco { stroke: var(--color); stroke-linecap: round; stroke-dasharray: calc(var(--avance) * 163.4) 163.4; }
.d-anillo b { font: 600 17px/20px var(--font-rounded); }
.d-anillo--aviso { --color: var(--aviso-relleno); }
.d-anillo--vencido { --color: var(--negativo); }

/* ---------- Chips y avisos ---------- */
.d-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--radius-capsula); font: 600 12px/16px var(--font-sans); background: var(--relleno); color: var(--tinta-2); }
.d-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

.d-aviso strong { display: block; font: 600 15px/20px var(--font-sans); }
.d-aviso span { display: block; font: 400 13px/18px var(--font-sans); color: var(--tinta-2); }

/* ---------- Movimiento ---------- */
@media (prefers-reduced-motion: reduce) { .d-boton { transition: none; } }

/*APP:START*/
/* Consulta: Indicadores, Lecturas, Cartelera y Ajustes. Los componentes d-* son del sistema Domésticas 27 (diseno27/
   del repositorio casa); aquí van solo las piezas propias (c-*), las mismas de Casa y Finanzas más las de los gráficos. */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; touch-action: pan-x pan-y; background: var(--fondo); }
body { margin: 0; min-height: 100vh; }
button, input, textarea { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
.d-app { min-height: 100vh; --c-serie: var(--acento); }
[data-theme="dark"] .d-app { --c-serie: var(--acento-relleno); }
.d-cabecera { padding-top: calc(env(safe-area-inset-top) + 14px); }
.c-contenido { padding-bottom: calc(130px + env(safe-area-inset-bottom)); }

/* Barra superior compacta: aparece al desplazar, como en iOS 27 */
.c-barra-sup { position: fixed; top: 0; left: 0; right: 0; z-index: 20; padding: calc(env(safe-area-inset-top) + 11px) 16px 11px; text-align: center;
  font: 600 17px/22px var(--font-sans); background: var(--material, var(--vidrio)); box-shadow: 0 .5px 0 var(--separador);
  -webkit-backdrop-filter: blur(var(--desenfoque-barra)) saturate(var(--saturacion-vidrio)); backdrop-filter: blur(var(--desenfoque-barra)) saturate(var(--saturacion-vidrio));
  opacity: 0; pointer-events: none; transition: opacity .2s; }
.c-barra-sup.ver { opacity: 1; }

/* Barra de pestañas fija */
.c-pie { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; }
.c-desvanecer { position: fixed; left: 0; right: 0; bottom: 0; height: calc(120px + env(safe-area-inset-bottom)); z-index: 14; pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--fondo) 62%); }
.c-pie .d-barra-pie { position: static; }

/* Texto suelto */
.c-texto { margin: 12px 20px 0; font: 400 15px/21px var(--font-sans); color: var(--tinta-2); }
.c-texto b { color: var(--tinta); font-weight: 600; }
.c-nota { margin: 8px 20px 0; font: 400 13px/18px var(--font-sans); color: var(--tinta-2); }
.c-estado { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 22px 16px 0; font: 400 13px/18px var(--font-sans); color: var(--tinta-2); text-align: center; }
.c-punto { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--positivo); }
.c-punto--aviso { background: var(--aviso-relleno); }

/* Filas */
.d-lista > li { list-style: none; position: relative; }
.d-lista > li + li::before { content: ""; position: absolute; top: 0; left: 58px; right: 0; height: .5px; background: var(--separador); z-index: 1; }
.d-lista > li > .d-fila::before { display: none; }
.c-fila { appearance: none; border: 0; background: transparent; width: 100%; text-align: left; cursor: pointer; }
.c-fila:active { background: var(--relleno); }
.d-fila .c-chev { flex: none; color: var(--tinta-3); width: 18px; height: 18px; }
.c-tabla > li + li::before, .c-tabla > .d-fila + .d-fila::before { left: 16px; }
.c-tabla .d-texto strong { font-size: 15px; line-height: 20px; }
.c-tabla .d-valor { font-size: 15px; line-height: 20px; }
.c-tarjeta { margin: 0 16px; padding: 4px 16px 16px; }
.c-ajuste-seg { display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* Indicador destacado */
.c-heroe { appearance: none; border: 0; display: block; width: calc(100% - 32px); text-align: left; cursor: pointer; font: inherit; margin: 8px 16px 0; transition: transform .16s ease; }
.c-heroe:active { transform: scale(.985); }
.c-heroe .d-cifra-grande { white-space: nowrap; font-size: clamp(36px, 11.2vw, 44px); }
.c-heroe .d-pie { flex-wrap: wrap; row-gap: 10px; column-gap: 20px; }
.c-heroe .d-pie b { white-space: nowrap; }
.c-heroe--vacio .d-cifra-grande { opacity: .7; }

/* Gráfico de la portada */
.c-grafico-tarjeta { margin: 0 16px; padding: 12px 14px 12px; }
.c-grafico-tarjeta .d-segmentos { display: flex; margin-bottom: 8px; }
.c-grafico-tarjeta .d-segmentos button { flex: 1; }
.c-grafico-pie { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; font: 400 12px/16px var(--font-sans); color: var(--tinta-2); }
.c-grafico-pie b { color: var(--tinta); font-weight: 600; font-variant-numeric: tabular-nums; }
.c-grafico-pie span { white-space: nowrap; }

/* Tarjetas de indicadores */
.c-rejilla { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 12px 16px 0; }
.c-tile { appearance: none; border: 0; text-align: left; cursor: pointer; padding: 14px; display: flex; flex-direction: column; gap: 2px; min-height: 152px; color: var(--tinta); font: inherit; transition: transform .16s ease; }
.c-tile:active { transform: scale(.97); }
.c-tile--ancha { grid-column: 1 / -1; min-height: 0; }
.c-tile-etq { font: 600 13px/18px var(--font-sans); color: var(--tinta-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-tile-val { margin-top: 2px; font: 600 24px/28px var(--font-rounded); letter-spacing: -0.3px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-tile-val--largo { font-size: clamp(19px, 5.6vw, 22px); }
.c-tile-val--vacio { color: var(--tinta-3); }
.c-tile-cap { font: 400 12px/16px var(--font-sans); color: var(--tinta-2); }
.c-tile-delta { font: 600 12px/16px var(--font-sans); color: var(--tinta-2); }
.c-tile-spark { margin-top: auto; padding-top: 10px; }
.c-tile-spark svg { display: block; width: 100%; height: 34px; overflow: visible; }
.c-tile-fila { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; }
.c-tile-fila > span:first-child { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.c-tile-fila .c-tile-spark { flex: 0 0 42%; padding: 0 0 4px; }
.c-spark-l { fill: none; stroke: color-mix(in srgb, var(--c-serie) 55%, transparent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.c-spark-b { fill: color-mix(in srgb, var(--c-serie) 38%, transparent); }
.c-spark-hoy { fill: var(--c-serie); }
.c-spark-punto { fill: var(--c-serie); stroke: var(--superficie); stroke-width: 2; }

/* Gráfico */
.c-grafico { position: relative; touch-action: pan-y; transition: opacity .2s ease; -webkit-user-select: none; user-select: none; }
.c-grafico.ocupado { opacity: .45; }
.c-grafico svg { display: block; width: 100%; height: auto; overflow: visible; }
.c-grafico .grid-l { stroke: var(--separador); stroke-width: 1; shape-rendering: crispEdges; }
.c-grafico .zero { stroke: var(--tinta-3); stroke-width: 1; shape-rendering: crispEdges; }
.c-grafico .ax { fill: var(--tinta-3); font: 400 11px var(--font-sans); font-variant-numeric: tabular-nums; }
.c-grafico .ln { fill: none; stroke: var(--c-serie); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.c-grafico .ar { fill: var(--c-serie); fill-opacity: .1; stroke: none; }
.c-grafico .br { fill: var(--c-serie); transition: opacity .12s ease; }
.c-grafico.encima .br { opacity: .4; }
.c-grafico.encima .br.on { opacity: 1; }
.c-grafico .dot { fill: var(--c-serie); stroke: var(--superficie); stroke-width: 2; }
.c-grafico .xh { stroke: var(--tinta-3); stroke-width: 1; shape-rendering: crispEdges; }
.c-grafico .vacio { fill: var(--tinta-2); font: 400 14px var(--font-sans); }
.c-tip { position: absolute; z-index: 2; transform: translateX(-50%); pointer-events: none; white-space: nowrap; padding: 6px 10px; border-radius: 12px;
  background: var(--superficie); box-shadow: 0 0 0 .5px var(--vidrio-borde), 0 6px 18px rgba(10, 18, 40, .16); }
.c-tip b { display: block; font: 700 15px/19px var(--font-rounded); font-variant-numeric: tabular-nums; }
.c-tip small { display: block; font: 400 12px/16px var(--font-sans); color: var(--tinta-2); }

/* Hojas */
.c-fondo-hoja { position: fixed; inset: 0; z-index: 40; background: rgba(5, 8, 15, .38); opacity: 0; transition: opacity .25s; }
.c-fondo-hoja.abierta { opacity: 1; }
.c-hoja { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; max-height: 92vh; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  border-radius: 32px 32px 0 0; padding: 6px 20px calc(24px + env(safe-area-inset-bottom));
  background: var(--vidrio-tintado); box-shadow: var(--sombra-flotante);
  -webkit-backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio)); backdrop-filter: blur(var(--desenfoque-vidrio)) saturate(var(--saturacion-vidrio));
  transform: translateY(105%); transition: transform .38s cubic-bezier(.2, .9, .25, 1.06); }
.c-hoja.abierta { transform: none; }
.c-hoja::before { content: ""; display: block; width: 38px; height: 5px; border-radius: 3px; margin: 4px auto 6px; background: var(--tinta-3); opacity: .5; }
.c-hoja h2 { margin: 10px 0 2px; font: 700 22px/28px var(--font-sans); }
.c-hoja h3 { margin: 22px 0 6px; font: 600 17px/22px var(--font-sans); }
.c-hoja p { margin: 6px 0; font: 400 15px/21px var(--font-sans); color: var(--tinta-2); }
.c-hoja p b { color: var(--tinta); }
.c-hoja .c-sub { margin: 0; font-size: 14px; line-height: 19px; }
.c-hoja .c-pista { font-size: 13px; line-height: 18px; margin-top: 12px; }
.c-hoja .c-pila { display: grid; gap: 10px; margin-top: 18px; }
.c-hoja .d-boton { width: 100%; }
.c-hoja .d-lista { margin: 0; }
.c-hoja .c-seg { display: flex; margin-top: 14px; }
.c-hoja .c-seg button { flex: 1; padding: 8px 4px; min-width: 0; }
.c-hoja .c-grafico { margin-top: 14px; }
.c-grande { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-top: 12px; }
.c-grande b { font: 700 40px/44px var(--font-rounded); letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.c-grande span { font: 600 15px/20px var(--font-sans); color: var(--tinta-2); }
.c-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.c-stat { min-width: 0; padding: 10px; border-radius: 16px; background: var(--relleno); }
.c-stat small { display: block; font: 600 12px/16px var(--font-sans); color: var(--tinta-2); }
.c-stat b { display: block; margin-top: 2px; font: 700 15px/20px var(--font-rounded); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-stat em { display: block; font: normal 400 12px/16px var(--font-sans); color: var(--tinta-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.c-destacado { display: flex; align-items: center; gap: 8px; color: var(--acento) !important; font-weight: 600; }
.c-destacado svg { flex: none; }

/* Selección con chips */
.c-chips { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 12px; }
.c-chips input { position: absolute; opacity: 0; pointer-events: none; }
.c-chips label { display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: var(--radius-capsula); background: var(--relleno); font: 600 15px/20px var(--font-sans); cursor: pointer; }
.c-chips input:checked + label { background: var(--acento-relleno); color: var(--acento-sobre); }
.c-chips input:focus-visible + label { outline: 2px solid var(--acento); outline-offset: 2px; }

/* Lo que llega en la próxima versión */
.c-pronto { margin: 8px 16px 0; padding: 20px; }
.c-pronto .d-cuadro { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; color: #fff; background: linear-gradient(150deg, var(--acento-hi), var(--acento-lo)); }
.c-pronto .d-cuadro svg { width: 24px; height: 24px; }
.c-pronto h2 { margin: 14px 0 4px; font: 700 20px/25px var(--font-sans); }
.c-pronto p { margin: 8px 0 0; font: 400 15px/21px var(--font-sans); color: var(--tinta-2); }
.c-pronto p b { color: var(--tinta); font-weight: 600; }
.c-pronto .d-boton { width: 100%; margin-top: 16px; }

/* Botón que gira mientras actualiza */
@keyframes c-girar { to { transform: rotate(360deg); } }
.c-girando svg { animation: c-girar .9s linear infinite; }

/* Aviso flotante */
.c-toast { position: fixed; left: 16px; right: 16px; top: calc(env(safe-area-inset-top) + 10px); z-index: 60; transform: translateY(-160%); transition: transform .35s cubic-bezier(.2, .9, .25, 1.06); }
.c-toast.ver { transform: none; }
.c-toast.d-aviso { background: var(--vidrio-tintado); }
.c-toast .d-punto { background: var(--positivo); box-shadow: 0 0 0 4px color-mix(in srgb, var(--positivo) 22%, transparent); }
.c-toast--error .d-punto { background: var(--aviso-relleno); box-shadow: 0 0 0 4px color-mix(in srgb, var(--aviso-relleno) 25%, transparent); }

/* Campos y textos de formularios (los mismos de Finanzas) */
.c-campo { display: block; margin: 14px 0 0; }
.c-campo > span { display: block; margin: 0 0 6px 4px; font: 600 13px/18px var(--font-sans); color: var(--tinta-2); }
.c-campo input[type="text"], .c-campo input[type="password"] {
  display: block; width: 100%; min-height: 50px; border: 0; border-radius: 14px; background: var(--relleno); color: var(--tinta);
  font: 400 17px/22px var(--font-sans); padding: 13px 14px; -webkit-appearance: none; appearance: none; text-align: left; }
.c-campo input:focus { outline: 2px solid var(--acento); outline-offset: 1px; }
.c-codigo { text-transform: uppercase; letter-spacing: 3px; font-family: var(--font-rounded) !important; font-size: 22px !important; text-align: center !important; }
.c-error { margin: 10px 4px 0; font: 600 15px/20px var(--font-sans); color: var(--negativo) !important; }
.c-ok { margin: 10px 4px 0; font: 600 15px/20px var(--font-sans); color: var(--positivo) !important; }
.c-peligro { color: var(--negativo) !important; }
.c-boton-peligro { background: transparent; color: var(--negativo); box-shadow: none; }
.c-pasos { margin: 10px 20px 0; padding-left: 20px; font: 400 15px/21px var(--font-sans); color: var(--tinta-2); }
.c-pasos li { margin-top: 6px; }
.c-pasos b { color: var(--tinta); }
.c-pasos a, .c-hoja a { color: var(--acento); text-decoration: none; }
.c-pasos--hoja { margin: 6px 0 0; }
.c-interruptor { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--relleno); font: 400 17px/22px var(--font-sans); }
.c-interruptor input { width: 24px; height: 24px; accent-color: var(--acento-relleno); flex: none; }
.c-archivo { position: relative; overflow: hidden; cursor: pointer; }
.c-archivo input[type="file"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }

/* Cartelera: búsqueda */
.c-buscar { display: flex; align-items: center; gap: 12px; margin: 8px 16px 0; }
.c-buscar-campo { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: var(--radius-capsula); cursor: text; }
.c-buscar-campo > svg { flex: none; color: var(--tinta-2); }
.c-buscar-campo input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; font: 400 17px/22px var(--font-sans); color: var(--tinta); -webkit-appearance: none; appearance: none; outline: none; padding: 0; }
.c-buscar-campo input::placeholder { color: var(--tinta-3); }
.c-buscar-campo input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
.c-borrar { flex: none; appearance: none; border: 0; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--tinta-3); color: var(--superficie); padding: 0; cursor: pointer; }
.c-cancelar { flex: none; appearance: none; border: 0; background: none; color: var(--acento); font: 400 17px/22px var(--font-sans); padding: 0; cursor: pointer; }
.c-cart-seg { display: flex; margin: 14px 16px 0; }
.c-cart-seg button { flex: 1; }
.c-filtros { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; padding: 0 16px 2px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.c-filtros::-webkit-scrollbar { display: none; }
.c-filtros-sep { flex: none; width: 1px; height: 22px; background: var(--separador); }
.c-filtro { flex: none; appearance: none; border: 0; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: var(--radius-capsula); background: var(--relleno); color: var(--tinta); font: 600 14px/18px var(--font-sans); cursor: pointer; white-space: nowrap; }
.c-filtro[aria-pressed="true"] { background: var(--acento-relleno); color: var(--acento-sobre); }
.c-filtro small { font: 600 12px/16px var(--font-sans); opacity: .65; }
.c-filtro .c-plogo { width: 20px; height: 20px; border-radius: 5px; margin-left: -6px; }

/* Cartelera: filas con póster */
.c-titulos { margin-top: 12px; }
.c-titulos > li + li::before { left: 78px; }
.c-titulos .d-fila { gap: 12px; padding-top: 10px; padding-bottom: 10px; min-height: 0; }
.c-titulos .d-texto strong { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: normal; }
.c-titulos .d-texto > span { white-space: normal; }
.c-poster { flex: none; position: relative; width: 50px; height: 75px; border-radius: 9px; overflow: hidden; display: grid; place-items: center;
  background: linear-gradient(160deg, color-mix(in srgb, var(--acento-relleno) 30%, var(--relleno)), var(--relleno)); box-shadow: inset 0 0 0 .5px var(--vidrio-borde); }
.c-poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.c-poster > span { padding: 4px; font: 600 9px/11px var(--font-sans); color: var(--tinta-2); text-align: center; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; word-break: break-word; }
.c-logos { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
.c-logos-mas { font: 600 12px/16px var(--font-sans); color: var(--tinta-2); margin-left: 2px; }
.c-plogo { flex: none; position: relative; width: 22px; height: 22px; border-radius: 6px; overflow: hidden; display: grid; place-items: center; background: #262a33; color: #fff; }
.c-plogo b { font: 700 8px/1 var(--font-sans); letter-spacing: -.2px; }
.c-plogo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.c-estrellas { display: inline-flex; gap: 1px; margin-top: 5px; color: var(--acento); }
.c-res { position: relative; }
.c-res > .d-fila { padding-right: 64px; }
.c-res > .c-mas, .c-res .c-acciones { position: absolute; right: 12px; top: 50%; margin-top: -19px; z-index: 2; }
.c-res--dos > .d-fila { padding-right: 104px; }
.c-acciones { display: flex; gap: 8px; }
.c-mas { appearance: none; border: 0; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--relleno); color: var(--acento); cursor: pointer; padding: 0; }
.c-mas.on { background: var(--acento-relleno); color: var(--acento-sobre); }
.c-mas--gris { color: var(--tinta-2); }
.c-mas:active { transform: scale(.92); }
.c-vacio { margin: 32px 28px 0; text-align: center; color: var(--tinta-2); font: 400 15px/21px var(--font-sans); }
.c-vacio b { display: block; margin-bottom: 4px; color: var(--tinta); font: 600 17px/22px var(--font-sans); }
.c-vacio .d-boton { margin-top: 16px; }
.c-banda { appearance: none; border: 0; display: flex; align-items: center; gap: 12px; width: calc(100% - 32px); margin: 12px 16px 0; padding: 12px 14px; text-align: left; color: var(--tinta); font: inherit; cursor: pointer; }
.c-banda .d-cuadro { flex: none; width: 30px; height: 30px; border-radius: var(--radius-s); display: grid; place-items: center; color: #fff; background: linear-gradient(150deg, var(--acento-hi), var(--acento-lo)); }
.c-banda .d-texto { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.c-banda .d-texto strong { font: 600 15px/20px var(--font-sans); }
.c-banda .d-texto > span { font: 400 13px/18px var(--font-sans); color: var(--tinta-2); }
.c-banda .c-chev { flex: none; color: var(--tinta-3); }
.c-banda-fija { cursor: default; margin-top: 8px; }
.c-avance { display: block; height: 6px; margin-top: 8px; border-radius: 3px; background: var(--relleno); overflow: hidden; }
.c-avance i { display: block; height: 100%; border-radius: 3px; background: var(--acento-relleno); transition: width .3s ease; }
.c-avance--grande { height: 8px; margin: 12px 0 4px; }
.c-mas-fila { display: grid; margin: 14px 16px 0; }

/* Cartelera: ficha */
.c-ficha { display: flex; gap: 16px; align-items: flex-start; margin-top: 8px; }
.c-ficha .c-poster { width: 108px; height: 162px; border-radius: 14px; box-shadow: var(--sombra-vidrio); }
.c-ficha .c-poster > span { font-size: 12px; line-height: 15px; -webkit-line-clamp: 7; padding: 8px; }
.c-ficha-txt { min-width: 0; padding-top: 4px; }
.c-ficha-txt h2 { margin: 2px 0 4px !important; }
.c-ante { font: 600 13px/18px var(--font-sans); color: var(--tinta-2); }
.c-puntaje { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font: 600 14px/18px var(--font-sans); color: var(--tinta-2); }
.c-puntaje svg { color: var(--acento); }
.c-plat-g { margin: 10px 0 0 !important; font: 600 13px/18px var(--font-sans) !important; color: var(--tinta-2); }
.c-plats { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.c-plat { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 4px 12px 4px 4px; border-radius: var(--radius-capsula); background: var(--relleno); font: 600 14px/18px var(--font-sans); }
.c-plat .c-plogo { width: 28px; height: 28px; border-radius: 50%; }
.c-visto { margin-top: 16px !important; }
[data-theme="dark"] .c-fecha { color-scheme: dark; }
.c-fecha { flex: none; border: 0; border-radius: 10px; background: var(--relleno); color: var(--tinta); padding: 6px 10px; font: 400 17px/22px var(--font-sans); -webkit-appearance: none; appearance: none; min-height: 36px; }
.c-notas { display: flex; gap: 2px; }
.c-notas button { appearance: none; border: 0; background: none; padding: 2px; color: var(--tinta-3); opacity: .55; cursor: pointer; }
.c-notas button.on { color: var(--acento); opacity: 1; }
.c-resumen-nf { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.c-resumen-nf div { padding: 12px 14px; border-radius: 16px; background: var(--relleno); }
.c-resumen-nf b { display: block; font: 700 28px/32px var(--font-rounded); font-variant-numeric: tabular-nums; }
.c-resumen-nf span { font: 400 13px/18px var(--font-sans); color: var(--tinta-2); }
.c-hoja .c-titulos { margin-top: 8px; }
.c-hoja label.d-boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.d-fila .d-texto .c-logos { display: flex; }
.d-fila .d-texto .c-plogo { display: grid; color: #fff; font: inherit; }
.d-fila .d-texto .c-logos-mas { display: inline; font: 600 12px/16px var(--font-sans); }
.d-fila .d-texto .c-estrellas { display: inline-flex; color: var(--acento); }

/* Lecturas */

/* Domésticas 27 — skins. Un skin cambia solo el aspecto: se elige en Ajustes → Apariencia y queda en <html data-skin="…">.
   Sin data-skin (o «vidrio») la app se ve con el diseño de vidrio de siempre. Este bloque va al final del CSS de cada
   app (después de APP), para poder ajustar también las piezas propias (c-*). Las reglas de cada skin empiezan con
   [data-skin="…"], así que no tocan el diseño por omisión. Para agregar un skin: sus variables, sus ajustes de
   componentes y una opción más en Ajustes de cada app. */

/* ===================== Tinta electrónica ===================== */
/* Como un lector de libros electrónicos (Kindle): papel gris cálido, tinta negra, letra con serifa, líneas finas en vez
   de vidrio y sombras, sin colores ni degradados y sin animaciones. En oscuro, letra clara sobre negro. */
html[data-skin="tinta"] {

  --tinta: #161616; --tinta-2: #4c4b48; --tinta-3: #7b7974; --separador: #c4c0b6; --relleno: rgba(22, 22, 22, .07);
  --linea: #9d9990; --papel-velo: rgba(22, 22, 22, .18);
  --finanzas-texto: var(--tinta); --finanzas-relleno: var(--tinta); --finanzas-sobre: var(--superficie); --finanzas-hi: var(--tinta); --finanzas-lo: var(--tinta); --finanzas-brillo: transparent;
  --casa-texto: var(--tinta); --casa-relleno: var(--tinta); --casa-sobre: var(--superficie); --casa-hi: var(--tinta); --casa-lo: var(--tinta); --casa-brillo: transparent;
  --noche-texto: var(--tinta); --noche-relleno: var(--tinta); --noche-sobre: var(--superficie); --noche-hi: var(--tinta); --noche-lo: var(--tinta); --noche-brillo: transparent;
  --consulta-texto: var(--tinta); --consulta-relleno: var(--tinta); --consulta-sobre: var(--superficie); --consulta-hi: var(--tinta); --consulta-lo: var(--tinta); --consulta-brillo: transparent;
  --juegos-texto: var(--tinta); --juegos-relleno: var(--tinta); --juegos-sobre: var(--superficie); --juegos-hi: var(--tinta); --juegos-lo: var(--tinta); --juegos-brillo: transparent;
  --reloj-rojo: var(--tinta); --positivo: var(--tinta); --negativo: var(--tinta); --aviso: var(--tinta); --aviso-relleno: var(--tinta-3);
  --sombra-vidrio: 0 0 0 1px var(--linea); --sombra-flotante: 0 0 0 1.5px var(--tinta); --sombra-heroe: 0 0 0 2px var(--tinta);
  --desenfoque-vidrio: 0px; --desenfoque-barra: 0px; --saturacion-vidrio: 100%;

  --font-rounded: var(--font-sans);

}
html[data-skin="tinta"][data-theme="dark"] {
  --fondo: #0d0d0c; --superficie: #151514; --superficie-2: #1e1e1c;
  --vidrio: #151514; --vidrio-tintado: #151514; --vidrio-borde: #ecebe6;
  --tinta: #ecebe6; --tinta-2: #b3b1ab; --tinta-3: #85837e; --separador: #3d3c39; --relleno: rgba(236, 235, 230, .09);
  --linea: #5a5955; --papel-velo: rgba(0, 0, 0, .55);
  color-scheme: dark;
}

/* ---------- Lectura de las fuentes, con copia en el iPhone ---------- */
const S = {};              // S[código][año] = { t: leído, d: datos }

const FRESCO = 6 * 3600 * 1000;   // los años recientes se vuelven a leer cada 6 horas
function cached(code, year) {
  if (!S[code]) S[code] = {};
  if (!(year in S[code])) S[code][year] = leerLS(CL.dato + code + ':' + year, null);
  return S[code][year];
}
function keep(code, year, d) {
  const e = { t: Date.now(), d };
  S[code][year] = e;
  if (!guardarLS(CL.dato + code + ':' + year, e)) { podar(); guardarLS(CL.dato + code + ':' + year, e); }
}
// Si se llena el almacenamiento, se borran los años más antiguos (se vuelven a leer si hacen falta)
function podar() {
  const ks = [];
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(CL.dato) === 0) ks.push(k); }
  ks.sort((a, b) => +a.split(':').pop() - +b.split(':').pop());
  ks.slice(0, Math.ceil(ks.length / 3)).forEach((k) => { try { localStorage.removeItem(k); } catch (e) {} });
}
function isFresh(e, year) {

  return year !== 'all' && year < cur - 1 ? e.t > C.utcOf(year + 1 + '-02-15') : Date.now() - e.t < FRESCO;
}
async function fetchJSON(url, wait) {
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const t = ctl ? setTimeout(() => ctl.abort(), wait || 20000) : 0;
  try {
    const r = await fetch(url, { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
    if (!r.ok) throw new Error('HTTP ' + r.status);

// Se prueba primero la fuente que respondió la última vez y, si falla, la otra
let apiFirst = 0, apiUsed = '';
async function getMi(code, year) {
  let last = null;

    const i = (apiFirst + n) % C.APIS.length, a = C.APIS[i];
    try {
      const d = C.leerMi(await fetchJSON(a.url + (C.API_CODE[code] || code) + '/' + year, a.wait));
      apiFirst = i; apiUsed = a.name;
      return d;
    } catch (e) { last = e; }
  }
  throw last || new Error('red');
}
// Banco Central: directo del repositorio indicadores (siempre al día) y, si no se puede, desde su página
async function getBcch(code) {
  const urls = [C.BCCH_REPO + C.BCCH_FILES[code], C.BCCH_PAGINA + C.BCCH_FILES[code]];
  let last = null;
  for (const u of urls) { try { return C.leerBcch(await fetchJSON(u)); } catch (e) { last = e; } }
  throw new Error(last && /404/.test(last.message) ? 'sin-datos' : 'red');
}
async function load(code, year, force) {
  const e = cached(code, year);
  if (e && !force && isFresh(e, year)) return e.d;
  try {
    const d = C.BCCH_FILES[code] ? await getBcch(code) : await getMi(code, year);
    keep(code, year, d);
    return d;
  } catch (err) {
    if (e) return e.d;          // sin conexión: lo último que se leyó
    throw err;
  }
}
// Hasta cuatro lecturas a la vez
async function pool(tasks, n) {
  let i = 0;
  async function run() { while (i < tasks.length) { const k = i++; try { await tasks[k](); } catch (e) {} } }
  await Promise.all(Array.from({ length: Math.min(n, tasks.length) }, run));
}
function yearsFor(range) { const cur = new Date().getFullYear(), ys = []; for (let y = cur - range; y <= cur; y++) ys.push(y); return ys; }
async function ensure(inds, range, force) {
  const tasks = [], cur = new Date().getFullYear(), codes = [];
  inds.forEach((k) => { C.SOURCE[k].forEach((c) => { if (codes.indexOf(c) < 0) codes.push(c); }); });
  codes.forEach((c) => {
    if (C.BCCH_FILES[c]) { tasks.push(() => load(c, 'all', force).catch((e) => { failed[c] = (e && e.message) || 'red'; throw e; })); return; }
    const ys = yearsFor(c === 'ipc' ? 1 : range + (c === 'uf' ? 1 : 0));   // del IPC de findic.cl basta lo reciente
    if (c === 'uf' && new Date().getMonth() === 11) ys.push(cur + 1);   // en diciembre ya hay UF de enero
    ys.forEach((y) => tasks.push(() => load(c, y, force && y >= cur - 1).catch((e) => { if (y >= cur - 1) failed[c] = (e && e.message) || 'red'; throw e; })));
  });
  codes.forEach((c) => { delete failed[c]; });
  await pool(tasks, 4);
}
let cargando = false, ultimaLectura = +(leerLS(CL.lectura, 0) || 0);
async function refresh(manual) {
  if (cargando) return;
  cargando = true; pintarRecarga();
  await ensure(C.ORDER, 2, !!manual);
  await ensure(['tpm'], 4, false);   // la TPM cambia poco: para saber desde cuándo rige, se miran más años
  await ensure([prefs.grafico], prefs.range, false);
  cargando = false;
  ultimaLectura = Date.now(); guardarLS(CL.lectura, ultimaLectura);
  render();
  if (hoja && hoja.tipo === 'ind') repintarHoja();
  const malas = Object.keys(failed).filter((c) => failed[c] !== 'sin-datos');
  if (manual) avisar(malas.length ? 'Sin conexión' : 'Al día', malas.length ? 'Se muestra lo último que se leyó' : 'Datos leídos de nuevo', !!malas.length);
}
function pintarRecarga() { const b = document.querySelector('[data-a="recargar"]'); if (b) b.classList.toggle('c-girando', cargando); const e = $('estadoInd'); if (e) e.innerHTML = estadoTexto(); }

/* ---------- Textos ---------- */
function cuando(ms) {
  const d = new Date(ms), k = C.dayKey(d), t = hoy(), y = C.dayKey(new Date(Date.now() - 86400000));
  return (k === t ? 'hoy' : k === y ? 'ayer' : C.fmtDay(k)) + ', ' + C.pad(d.getHours()) + ':' + C.pad(d.getMinutes());
}
function faltaTexto(s) {

  if (C.IND[s.k].src === 'bcch' && f === 'sin-datos') return 'Llega con la próxima actualización desde el Banco Central.';

/* ---------- Gráficos ---------- */
// box: el contenedor .c-grafico; pts: [[fecha, valor]]; kind: line, step o bar; fmt y xfmt: textos del valor y la fecha
function grafico(id) { return `<div class="c-grafico" id="${id}" tabindex="0" aria-label="Gráfico histórico"><div class="c-tip" hidden><b></b><small></small></div><svg></svg></div>`; }
function dibujar(box, d, H) {
  if (!box || !d) return;
  const svg = box.querySelector('svg'), W = Math.max(260, Math.round(box.clientWidth || 340));
  const L = 44, R = 8, T = 10, B = 24, pw = W - L - R, ph = H - T - B, pts = d.pts, kind = d.kind;
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('width', W); svg.setAttribute('height', H);
  if (!pts.length) { svg.innerHTML = '<text class="vacio" x="' + W / 2 + '" y="' + H / 2 + '" text-anchor="middle">Sin datos para este periodo</text>'; box._ch = null; return; }
  svg.setAttribute('aria-label', 'De ' + d.fmt(pts[0][1]) + ' a ' + d.fmt(pts[pts.length - 1][1]));
  const vals = pts.map((p) => p[1]);
  let mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (kind === 'bar') { mn = Math.min(0, mn); mx = Math.max(0, mx); }
  else { const p0 = (mx - mn) * 0.08 || Math.abs(mx) * 0.02 || 1; mn -= p0; mx += p0; }
  const nt = C.niceTicks(mn, mx, 4), dec = C.stepDecimals(nt.step);
  const y = (v) => T + ph * (1 - (v - nt.lo) / (nt.hi - nt.lo));
  let h = '';
  nt.ticks.forEach((v) => {
    const yy = Math.round(y(v)) + 0.5;
    h += '<line class="' + (v === 0 && kind === 'bar' ? 'zero' : 'grid-l') + '" x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '"/>';
    h += '<text class="ax" x="' + (L - 8) + '" y="' + (yy + 4) + '" text-anchor="end">' + esc(d.ax(v, dec)) + '</text>';
  });
  const n = pts.length;
  let xs;
  if (kind === 'bar') {
    const band = pw / n, gap = band >= 6 ? 2 : band * 0.25, w = Math.min(24, band - gap), z = y(0);
    xs = pts.map((p, i) => L + band * i + band / 2);
    pts.forEach((p, i) => {
      const yy = y(p[1]), x0 = xs[i] - w / 2, r = Math.min(4, w / 2, Math.abs(yy - z));
      const top = p[1] >= 0, a = top ? yy : z, b = top ? z : yy, hh = Math.max(0.5, b - a);
      // extremo de datos redondeado, base recta
      let dd = top
        ? 'M' + x0 + ' ' + b + 'V' + (a + r) + 'Q' + x0 + ' ' + a + ' ' + (x0 + r) + ' ' + a + 'H' + (x0 + w - r) + 'Q' + (x0 + w) + ' ' + a + ' ' + (x0 + w) + ' ' + (a + r) + 'V' + b + 'Z'
        : 'M' + x0 + ' ' + a + 'V' + (b - r) + 'Q' + x0 + ' ' + b + ' ' + (x0 + r) + ' ' + b + 'H' + (x0 + w - r) + 'Q' + (x0 + w) + ' ' + b + ' ' + (x0 + w) + ' ' + (b - r) + 'V' + a + 'Z';
      if (hh <= 1) dd = 'M' + x0 + ' ' + (z - 0.5) + 'h' + w + 'v1h' + (-w) + 'Z';
      h += '<path class="br" data-i="' + i + '" d="' + dd + '"/>';
    });
  } else {
    const t0 = C.utcOf(pts[0][0]), t1 = C.utcOf(pts[n - 1][0]);
    xs = pts.map((p) => L + pw * (t1 > t0 ? (C.utcOf(p[0]) - t0) / (t1 - t0) : 1));
    let dd = '';
    C.thin(pts.map((p, i) => [p[0], p[1], i]), kind).forEach((p, j) => {
      const xx = xs[p[2]].toFixed(1), yy = y(p[1]).toFixed(1);
      dd += !j ? 'M' + xx + ' ' + yy : kind === 'step' ? 'H' + xx + 'V' + yy : 'L' + xx + ' ' + yy;
    });
    h += '<path class="ar" d="' + dd + 'V' + (T + ph).toFixed(1) + 'H' + xs[0].toFixed(1) + 'Z"/>';
    h += '<path class="ln" d="' + dd + '"/>';
    h += '<circle class="dot" cx="' + xs[n - 1].toFixed(1) + '" cy="' + y(pts[n - 1][1]).toFixed(1) + '" r="4"/>';
  }
  // Eje de tiempo: años en rangos largos, meses en un año
  const dias = (C.utcOf(pts[n - 1][0]) - C.utcOf(pts[0][0])) / 86400000, maxLab = Math.max(3, Math.floor(pw / 46)), marks = [];
  pts.forEach((p, i) => {
    const mo = +p[0].slice(5, 7), prev = pts[i - 1];
    if (dias > 500) { if (prev && prev[0].slice(0, 4) !== p[0].slice(0, 4)) marks.push({ i, t: p[0].slice(0, 4) }); }
    else if (!prev || prev[0].slice(0, 7) !== p[0].slice(0, 7)) marks.push({ i, t: mo === 1 ? p[0].slice(0, 4) : C.MES[mo - 1] });
  });
  const every = Math.max(1, Math.ceil(marks.length / maxLab));
  marks.forEach((m, j) => {
    if (j % every) return;
    const xx = xs[m.i];
    if (xx < L + 10 || xx > W - R - 10) return;
    h += '<text class="ax" x="' + xx.toFixed(1) + '" y="' + (H - 5) + '" text-anchor="middle">' + m.t + '</text>';
  });
  h += '<line class="xh" x1="0" x2="0" y1="' + T + '" y2="' + (T + ph) + '" visibility="hidden"/>';
  if (kind !== 'bar') h += '<circle class="dot xd" r="5" cx="0" cy="0" visibility="hidden"/>';
  svg.innerHTML = h;
  box._ch = { pts, xs, y, kind, fmt: d.fmt, xfmt: d.xfmt, W, i: -1 };
}
function marcar(box, i) {
  const c = box && box._ch;

function cercano(box, clientX) {

  return Math.abs(c.xs[lo] - x) <= Math.abs(c.xs[hi] - x) ? lo : hi;
}

/* ---------- Cartelera: listas en GitHub a través de domesticas-api ---------- */
const API = 'https://domesticas-api.vercel.app';
const CK = { llave: 'con27.llave', datos: 'con27.datos', cola: 'con27.cola', sync: 'con27.sync', prov: 'con27.cart.prov', tmdb: 'con27.cart.tmdb', nf: 'con27.cart.nf' };
let llave = leerLS(CK.llave, null);
let srv = leerLS(CK.datos, {});            // { 'cartelera.json': { contenido, sha, leido } }
let cola = leerLS(CK.cola, []);            // cambios por guardar
let sync = leerLS(CK.sync, { at: 0 });
let provs = leerLS(CK.prov, {});           // plataformas de cada título, solo en este iPhone: { k: { prov, at } }
let tmdbKey = String(leerLS(CK.tmdb, '') || '');

let memo = null;
// Lo guardado en GitHub más los cambios que aún no se guardan
function cart() {
  const s = srv[K.ARCHIVO], f = (s ? s.sha + '|' + s.leido : '') + '|' + cola.length + '|' + (cola.length ? cola[cola.length - 1].cambio.id : '');
  if (memo && memo.f === f) return memo.d;
  let d = s && s.contenido != null ? s.contenido : K.plantilla();
  for (const p of cola) if (p.archivo === K.ARCHIVO) { try { d = K.aplicar(d, p.cambio); } catch (e) { /* un cambio que ya no aplica */ } }
  memo = { f, d };
  return d;
}
const itemDe = (k) => cart().items[k] || null;
const baseDe = (k) => itemDe(k) || fichas[k] || detalles[k] || null;
const provDe = (it) => (provs[K.keyOf(it)] || {}).prov || null;
function guardarCola() { if (!guardarLS(CK.cola, cola)) avisar('Sin espacio en el iPhone', 'No se pudo guardar el cambio pendiente', true); }
async function api(metodo, ruta, cuerpo) {
  const r = await fetch(API + ruta, {
    method: metodo, cache: 'no-store',
    headers: Object.assign({ Authorization: 'Bearer ' + llave.llave }, cuerpo ? { 'Content-Type': 'application/json' } : {}),
    body: cuerpo ? JSON.stringify(cuerpo) : undefined,
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || 'Error ' + r.status); e.status = r.status; throw e; }
  return d;
}
async function leerServidor() {
  const d = await api('GET', '/api/datos?archivo=' + encodeURIComponent(K.ARCHIVO));
  srv[K.ARCHIVO] = { contenido: d.contenido != null ? d.contenido : K.plantilla(), sha: d.sha || null, leido: Date.now() };
}
function hacer(cambio, mensaje) {
  cambio.id = cambio.id || K.nuevoId();
  try { K.aplicar(cart(), cambio); } catch (e) { avisar('No se pudo registrar', e.message, true); return false; }
  cola.push({ archivo: K.ARCHIVO, cambio, mensaje });
  guardarCola();
  sincronizar(false);
  return true;
}
let enCurso = null, otraVez = false;
function sincronizar(releer) {
  if (!llave) return Promise.resolve();
  if (enCurso) { otraVez = true; return enCurso; }
  enCurso = (async () => {
    try {
      if (releer || !srv[K.ARCHIVO] || !srv[K.ARCHIVO].leido) await leerServidor();
      for (let intento = 0; cola.length && intento < 4; intento++) {
        const lote = cola.slice();
        let d = srv[K.ARCHIVO].contenido;
        lote.forEach((p) => { try { d = K.aplicar(d, p.cambio); } catch (e) { /* ya no aplica: se descarta */ } });
        const quitar = () => { const ids = lote.map((p) => p.cambio.id); cola = cola.filter((p) => !ids.includes(p.cambio.id)); guardarCola(); };
        if (JSON.stringify(d) === JSON.stringify(srv[K.ARCHIVO].contenido)) { quitar(); continue; }
        const mensaje = lote.length === 1 ? lote[0].mensaje : lote.length + ' cambios: ' + lote.map((p) => p.mensaje).slice(0, 4).join('; ');
        try {
          const r = await api('PUT', '/api/datos?archivo=' + encodeURIComponent(K.ARCHIVO), { contenido: d, sha: srv[K.ARCHIVO].sha, mensaje: 'Consulta · ' + mensaje });
          srv[K.ARCHIVO] = { contenido: d, sha: r.sha, leido: Date.now() };
          quitar();
        } catch (e) {
          if (e.status === 409) { await leerServidor(); continue; }
          throw e;
        }
      }
      guardarLS(CK.datos, srv);
      sync = { at: Date.now() };
    } catch (e) {
      sync = { at: sync.at || 0, error: e.status === 401 ? 'La llave de este iPhone ya no es válida. Conéctalo de nuevo en Ajustes.' : e.status ? e.message : 'Sin conexión', status: e.status || 0 };
    } finally {
      guardarLS(CK.sync, sync);
      enCurso = null; memo = null;
      if (!hoja) render(); else if (hoja.tipo === 'tmdb' || hoja.tipo === 'nf') repintarHoja();
      if (otraVez) { otraVez = false; sincronizar(false); }
    }
  })();
  return enCurso;
}
function releerSiHaceFalta() {
  const s = srv[K.ARCHIVO];
  if (llave && (!s || Date.now() - (s.leido || 0) > 30000 || cola.length)) sincronizar(!s || Date.now() - (s.leido || 0) > 30000);
}
function hace(ms) {
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return 'recién';
  if (s < 3600) return 'hace ' + Math.round(s / 60) + ' min';
  if (s < 86400) return 'hace ' + Math.round(s / 3600) + ' h';

}
function estadoSync() {
  let punto = '', txt;
  if (!llave) { punto = 'aviso'; txt = cola.length ? C.plural(cola.length, '1 cambio', cola.length + ' cambios') + ' guardados solo en este iPhone · conéctalo en Ajustes' : 'Sin conectar a GitHub'; }
  else if (sync.error) { punto = 'aviso'; txt = sync.error + (cola.length ? ' · ' + cola.length + ' ' + C.plural(cola.length, 'cambio', 'cambios') + ' por guardar' : ''); }
  else if (cola.length) txt = 'Guardando ' + cola.length + ' ' + C.plural(cola.length, 'cambio', 'cambios') + '…';
  else txt = sync.at ? 'Guardado en GitHub · ' + hace(sync.at) : 'Conectado a GitHub';
  return `<p class="c-estado"><span class="c-punto${punto ? ' c-punto--aviso' : ''}"></span>${esc(txt)}</p>`;
}

/* ---------- Cartelera: TMDB ---------- */
function falla(code, msg) { const e = new Error(msg); e.code = code; return e; }
async function tmdb(path, params = {}, clave) {
  const key = String(clave != null ? clave : tmdbKey).trim();
  if (!key) throw falla('nokey', 'Falta la clave de TMDB. Agrégala en Ajustes.');
  const url = new URL(K.TMDB_API + path);
  url.searchParams.set('language', K.LANG);
  for (const [a, b] of Object.entries(params)) url.searchParams.set(a, b);
  const headers = { accept: 'application/json' };
  if (key.length > 40) headers.Authorization = 'Bearer ' + key; else url.searchParams.set('api_key', key);
  let res;
  try { res = await fetch(url, { headers }); } catch (e) { throw falla('net', 'No hay conexión con TMDB. Revisa la señal e intenta de nuevo.'); }
  if (res.status === 401) throw falla('auth', 'TMDB no aceptó la clave. Revísala en Ajustes.');
  if (res.status === 404) throw falla('404', 'TMDB no tiene este título.');
  if (res.status === 429) throw falla('rate', 'TMDB pidió esperar un momento.');
  if (!res.ok) throw falla('http', 'TMDB respondió con un error (' + res.status + '). Intenta en un momento.');
  return res.json();
}
const cargandoDet = {};
async function cargarDetalle(k) {
  if (detalles[k]) return detalles[k];
  const [type, id] = k.split(':');
  const r = await tmdb('/' + type + '/' + id, { append_to_response: 'watch/providers' });
  let overview = r.overview || '';
  if (!overview) { try { overview = (await tmdb('/' + type + '/' + id, { language: 'en-US' })).overview || ''; } catch (e) { /* sin sinopsis */ } }
  const extra = [];
  if (type === 'movie' && r.runtime) extra.push(K.fmtRuntime(r.runtime));
  if (type === 'tv') {
    if (r.number_of_seasons) extra.push(r.number_of_seasons + ' ' + C.plural(r.number_of_seasons, 'temporada', 'temporadas'));
    if (K.TV_STATUS[r.status]) extra.push(K.TV_STATUS[r.status]);
  }
  const d = Object.assign(K.norm(r, type), { overview, genres: (r.genres || []).slice(0, 3).map((g) => g.name).join(', '), extra: extra.join(' · '), vote: r.vote_count > 20 ? r.vote_average : 0, prov: K.parseProv(r['watch/providers']) });
  detalles[k] = d; fichas[k] = fichas[k] || K.tituloCorto(d);
  provs[k] = { prov: d.prov, at: Date.now() }; guardarLS(CK.prov, provs);
  // Si TMDB cambió el título o el póster de uno de la lista, se actualiza
  const it = itemDe(k);
  if (it && ((d.title && d.title !== it.title) || (d.poster && d.poster !== it.poster) || (d.year && d.year !== it.year))) hacer({ tipo: 'ficha', k, title: d.title, year: d.year, poster: d.poster }, 'Ficha de ' + d.title);
  return d;
}
function pedirDetalle(k) {
  if (detalles[k] || cargandoDet[k]) return;
  cargandoDet[k] = { at: Date.now() };
  cargarDetalle(k).then(() => { delete cargandoDet[k]; }, (e) => { cargandoDet[k] = { error: e.message }; })
    .finally(() => { if (hoja && hoja.tipo === 'titulo' && hoja.k === k) repintarHoja(); else if (ui.tab === 'cartelera' && !hoja) pintarCart(); });

// Las plataformas de Quiero ver se revisan cada 3 días, de a 25 títulos
let revisandoProv = false;
async function revisarPlataformas() {
  if (revisandoProv || !tmdbKey) return;

function nfEmpezar() {

async function nfLista(path, query) {
  const r = await tmdb(path, { query, include_adult: 'false', page: '1' });
  const type = path === '/search/tv' ? 'tv' : path === '/search/movie' ? 'movie' : '';
  return (r.results || []).filter((x) => type || x.media_type === 'movie' || x.media_type === 'tv').map((x) => K.norm(x, type || x.media_type));
}
async function nfUno(e, tvFallback = true) {
  for (const t of K.nfIntentos(e, tvFallback)) { const hit = K.nfBest(await nfLista(t.path, t.query), t.query, t.min); if (hit) return hit; }
  return null;
}
// Pares [entrada, título]: un grupo sin «Temporada» que no resulta ser serie se separa en películas
async function nfResolver(e) {
  if (!e.name) return [[e, null]];
  if (!e.weak) return [[e, await nfUno(e, !e.explicit)]];   // Prime Video ya dice si es película
  for (const q of [e.name, ...(e.alts || [])]) { const hit = K.nfBest(await nfLista('/search/tv', q), q, 60); if (hit) return [[e, hit]]; }
  const out = [], quedan = [];
  for (const m of e.members || []) {
    const me = { name: m.name, kind: 'movie', first: m.first, last: m.last, plays: m.plays, eps: 0 };
    const hit = await nfUno(me, false);
    if (hit) out.push([me, hit]); else quedan.push(m);
  }
  if (quedan.length) {
    const f = quedan.map((m) => m.first).filter(Boolean).sort(), l = quedan.map((m) => m.last).filter(Boolean).sort();
    out.push([{ name: e.name, kind: 'tv', first: f[0] || '', last: l[l.length - 1] || '', plays: quedan.reduce((a, m) => a + m.plays, 0), eps: quedan.length }, null]);
  }
  return out;
}
function nfPendiente(e) {
  nf.pending.push({ name: e.name, kind: e.kind, first: e.first, last: e.last, plays: e.plays, eps: e.eps, src: e.src || 'Netflix', explicit: !!e.explicit });
  if (nf.stats) nf.stats.unmatched++;
}
// Lo identificado se guarda en GitHub de a 40 títulos; el número del lote evita repetirlo si la app se cierra a medias
function nfVaciar(run) {

  const st = nf.stats, nuevos = new Set();
  nf.lote.forEach(({ r }) => {
    const k = K.keyOf(r), it = itemDe(k);
    if (!st) return;
    if (!it) { if (!nuevos.has(k)) { st.added++; nuevos.add(k); } }
    else if (!(it.nf && it.nf.run === run)) st.merged++;
  });
  hacer({ id: 'h' + run + '-' + nf.loteN, tipo: 'historial', run, dia: hoy(), pares: nf.lote }, 'Historial: ' + nfPlural(nf.lote.length, 'título', 'títulos'));

}
async function nfCorrer() {

  while (nf.queue.length) {
    const lote = nf.queue.slice(0, 4);
    const out = await Promise.all(lote.map((e) => nfResolver(e).then((list) => ({ e, list }), (err) => ({ e, err }))));

    }
    if (nf.lote.length >= 40 || parar || !nf.queue.length) nfVaciar(run);

function lecOut() {

  if (!lec.data) {

  }
  let h = `<div class="d-segmentos c-cart-seg" role="group" aria-label="Sección">` + [['leyendo', 'Leyendo'], ['desafios', 'Desafíos'], ['quiero', 'Quiero leer']]
    .map(([v, t]) => `<button data-a="seg" data-seg="lecSub" data-v="${v}" aria-pressed="${ui.lecSub === v}">${t}</button>`).join('') + '</div>';
  h += ui.lecSub === 'desafios' ? vistaDesafios() : ui.lecSub === 'quiero' ? vistaQuiereLeer() : vistaLeyendo();

}
function vistaLeyendo() {
  const d = lec.data, ch = L.desafio(d, +hoy().slice(0, 4)), leyendo = d.reading || [], recientes = (d.read || []).slice(0, 12);
  let h = heroeDesafio(ch);
  h += `<div class="d-seccion"><h2>Leyendo ahora</h2></div>`;
  h += leyendo.length ? leyendo.map((b) => `<div class="d-vidrio c-libro"><button class="c-libro-btn" data-a="lecLibro" data-id="${esc(b.id)}">${portadaHTML(b)}<span class="c-libro-txt"><strong>${esc(b.title)}</strong>` +
    (b.series ? `<span class="c-serie">${esc(b.series)}</span>` : '') + `<span class="c-autor">${esc(b.author || '')}</span>${avanceHTML(b)}</span></button>${accionesGR(b)}</div>`).join('')
    : vacio('No tienes libros en lectura', 'Lo que marques como «Leyendo» en Goodreads aparece aquí.');
  if (recientes.length) h += '<div class="d-seccion"><h2>Leídos recientemente</h2></div>' + estanteHTML(recientes);
  return h;
}
function cifrasHTML(ano, leidos, enHoja) {
  const c = L.cifrasAno(lec.data, ano, leidos, hoy());
  const f1 = (n) => n.toLocaleString('es-CL', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const cel = [['Libros', L.fmtNum(c.libros)], ['Por mes', c.porMes ? f1(c.porMes) : '—'], ['Tu nota', c.nota ? f1(c.nota) + ' ★' : '—']];
  return enHoja ? `<div class="c-stats">${cel.map(([a, b]) => `<div class="c-stat"><small>${a}</small><b>${b}</b></div>`).join('')}</div>`
    : `<div class="c-cifras">${cel.map(([a, b]) => `<div class="d-vidrio c-cifra"><small>${a}</small><b>${b}</b></div>`).join('')}</div>`;
}
function vistaDesafios() {
  const d = lec.data, ano = +hoy().slice(0, 4), ch = L.desafio(d, ano), pasados = (d.challenges || []).filter((c) => c.year !== ano);
  const conMeta = (d.challenges || []).filter((c) => c.goal), cumplidos = conMeta.filter((c) => c.read >= c.goal).length;
  let h = heroeDesafio(ch) + cifrasHTML(ano, ch.read);
  if ((ch.books || []).length) h += `<div class="d-seccion"><h2>Leídos en ${ano}</h2><a href="#" data-a="lecAno" data-ano="${ano}">Ver todos</a></div>` + estanteHTML(ch.books.slice(0, 12));
  if (pasados.length) {
    h += `<div class="d-seccion"><h2>Años anteriores</h2></div>` + (conMeta.length ? `<p class="c-nota">${cumplidos} de ${L.plural(conMeta.length, 'desafío cumplido', 'desafíos cumplidos')}.</p>` : '') +
      '<ul class="d-lista d-vidrio c-anos">' + pasados.map((c) => {
        const ok = c.goal && c.read >= c.goal, p = c.goal ? Math.min(100, c.read / c.goal * 100) : 0;
        return `<li><button class="d-fila c-fila" data-a="lecAno" data-ano="${c.year}"><span class="c-ano-n">${c.year}</span><span class="d-texto"><strong>${c.goal ? L.fmtNum(c.read) + ' de ' + L.fmtNum(c.goal) : L.plural(c.read, 'libro', 'libros')}</strong>` +
          (c.goal ? `<span class="c-barra"><i style="width:${p}%"></i></span>` : '<span>Sin meta</span>') + `</span>` +
          (ok ? `<span class="d-chip d-chip--positivo">${ico('check', 14, 2.6)}${Math.round(c.read / c.goal * 100)} %</span>` : c.goal ? `<span class="d-valor">${Math.round(c.read / c.goal * 100)} %</span>` : '') + `<span class="c-chev">${ico('chev', 18)}</span></button></li>`;
      }).join('') + '</ul>';

}
function vistaQuiereLeer() {
  const lista = L.ordenarQuiero(lec.data.toRead, ui.lecOrden), paginas = lista.reduce((s, b) => s + (b.pages || 0), 0);
  let h = '<div class="c-filtros">' + [['recent', 'Recientes'], ['title', 'Título'], ['author', 'Autor']].map(([v, t]) => `<button class="c-filtro" data-a="seg" data-seg="lecOrden" data-v="${v}" aria-pressed="${ui.lecOrden === v}">${t}</button>`).join('') + '</div>';
  if (!lista.length) return h + vacio('Tu lista está vacía', 'Los libros que marques como «Quiero leer» en Goodreads aparecen aquí.');
  h += `<p class="c-nota">${L.plural(lista.length, 'libro', 'libros')}${paginas ? ' · ' + L.fmtNum(paginas) + ' páginas' : ''}${lec.data.counts && lec.data.counts.toRead > lista.length ? ' (se muestran los ' + L.fmtNum(lista.length) + ' más recientes de ' + L.fmtNum(lec.data.counts.toRead) + ')' : ''}.</p>`;
  return h + '<ul class="d-lista d-vidrio c-titulos">' + lista.map((b) => filaLibro(b)).join('') + '</ul>';
}
let tLec = 0, nLec = 0;
function buscarLibros(q, ya) {
  lbus.q = q; clearTimeout(tLec);
  const t = q.trim();
  if (!t) { lbus.res = null; lbus.error = ''; lbus.cargando = false; pintarLec(); return; }
  if (t.length < 3 && !ya) { pintarLec(); return; }
  lbus.cargando = true; pintarLec();
  tLec = setTimeout(async () => {
    const n = ++nLec;
    try {
      const d = await apiLec({ vista: 'buscar', q: t });
      if (n !== nLec) return;
      lbus.res = d.results || []; lbus.error = '';
      if (lbus.res.length || ya) { lbus.recientes = L.recordar(lbus.recientes, t); guardarLS(LK.recientes, lbus.recientes); }
    } catch (e) { if (n !== nLec) return; lbus.res = null; lbus.error = e.message; }
    lbus.cargando = false; pintarLec();
  }, ya ? 0 : 500);
}
function vistaLecBusqueda() {
  if (!llave) return vacio('Conecta este iPhone', 'La búsqueda en Goodreads pasa por domesticas-api.', '<button class="d-boton" data-a="tab" data-t="ajustes">Ir a Ajustes</button>');
  const q = lbus.q.trim();
  if (!q) {
    if (!lbus.recientes.length) return vacio('Busca en Goodreads', 'Encuentra cualquier libro por su título, autor o ISBN.');
    return '<div class="d-seccion"><h2>Recientes</h2><a href="#" data-a="lecOlvidar">Borrar</a></div><div class="c-filtros c-filtros--envolver">' +
      lbus.recientes.map((x) => `<button class="c-filtro" data-a="lecReciente" data-q="${esc(x)}">${esc(x)}</button>`).join('') + '</div>';
  }
  if (lbus.cargando) return vacio('Buscando…', '');
  if (lbus.error) return vacio('Búsqueda no disponible', lbus.error, `<button class="d-boton d-boton--discreto" data-a="lecReintentar">${ico('recargar', 20)}Reintentar</button>`);
  if (!lbus.res) return vacio('Escribe al menos 3 letras', '');
  if (!lbus.res.length) return vacio('Sin resultados', 'No se encontraron libros para «' + q + '».');
  return `<p class="c-nota">${L.plural(lbus.res.length, 'resultado', 'resultados')} en Goodreads.</p><ul class="d-lista d-vidrio c-titulos">` + lbus.res.map((b) => filaLibro(b, insigniaDe(b.id))).join('') + '</ul>';
}

/* ---------- Lecturas: hojas ---------- */
function hojaLibro(id) {
  const b = libroDe(id);
  if (!b) return '<p>No se encontró el libro.</p><div class="c-pila"><button class="d-boton d-boton--discreto" data-a="cerrar">Cerrar</button></div>';
  const st = lec.idx.get(id);
  let h = `<div class="c-ficha">${portadaHTML(b, 'c-portada--grande')}<div class="c-ficha-txt"><h2>${esc(b.title)}</h2>` + (b.series ? `<p class="c-sub">${esc(b.series)}</p>` : '') + `<p class="c-sub">${esc(b.author || '')}</p>` +
    (b.genres && b.genres.length ? `<div class="c-plats">${b.genres.map((g) => `<span class="c-genero">${esc(g)}</span>`).join('')}</div>` : '') + '</div></div>';
  const hechos = [b.avgRating ? ['Promedio', '★ ' + L.fmtPromedio(b.avgRating)] : null, b.pages ? ['Páginas', L.fmtNum(b.pages)] : null, b.published ? ['Publicado', b.published] : null].filter(Boolean);
  if (hechos.length) h += `<div class="c-stats">${hechos.map(([a, v]) => `<div class="c-stat"><small>${a}</small><b>${esc(v)}</b></div>`).join('')}</div>`;
  if (st) {
    let t = '', s = '';
    if (st.shelf === 'reading') { const pr = b.progress; t = 'Leyendo' + (pr && pr.percent != null ? ' · ' + pr.percent + ' %' : ''); s = pr && pr.page ? `Página ${L.fmtNum(pr.page)} de ${L.fmtNum(pr.of)}` : pr && pr.updatedAt ? 'Actualizado el ' + L.fmtFecha(pr.updatedAt, hoy(), true) : 'Sin avance registrado'; }
    else if (st.shelf === 'read') { t = 'Leído' + (b.year ? ' en ' + b.year : ''); s = b.userRating ? 'Tu nota: ' + String(b.userRating).replace('.', ',') + ' de 5' : 'Sin calificar'; }
    else { t = 'En Quiero leer'; s = 'Está en tu lista de Goodreads'; }
    h += `<ul class="d-lista d-vidrio c-visto"><li class="d-fila"><span class="d-cuadro">${ico(st.shelf === 'read' ? 'check' : st.shelf === 'reading' ? 'libro' : 'marca', 18)}</span><span class="d-texto"><strong>${esc(t)}</strong><span>${esc(s)}</span>` +
      (st.shelf === 'read' && b.userRating ? estrellasL(b.userRating) : '') + (st.shelf === 'reading' && b.progress && b.progress.percent != null ? `<span class="c-barra"><i style="width:${b.progress.percent}%"></i></span>` : '') + '</span></li></ul>';
  }
  if (st && st.shelf === 'reading') h += accionesGR(b) + '<p class="c-pista">Se abre el libro en Goodreads. Al volver, Lecturas se actualiza sola.</p>';
  const desc = b.description || '';
  if (desc) h += `<h3>Sinopsis</h3><p class="c-desc${desc.length > 320 ? ' c-desc--corta' : ''}" id="lecDesc">${esc(desc)}</p>` + (desc.length > 320 ? '<button class="c-mas-texto" data-a="lecMas">Más</button>' : '');
  else if (b._cargando) h += '<p>Cargando la ficha…</p>';
  h += '<div class="c-pila">' + (st && st.shelf === 'reading' ? '' : `<a class="d-boton d-boton--discreto" href="${esc(urlLibro(b))}" target="_blank" rel="noopener" data-sinc="1">${ico('enlace', 20)}Abrir en Goodreads</a>`) +
    '<button class="d-boton d-boton--discreto" data-a="cerrar">Cerrar</button></div>';
  return h;
}
async function completarLibro(id) {
  const b = libroDe(id);
  if (!b || b._listo || (b.description && b.pages && !b.descriptionTruncated)) return;
  b._cargando = true;
  try {
    const x = await apiLec({ vista: 'libro', id });
    for (const k of ['description', 'pages', 'avgRating', 'published', 'genres', 'cover', 'series']) {
      if (x[k] && (!b[k] || (k === 'description' && b.descriptionTruncated))) b[k] = x[k];
    }
  } catch (e) { /* queda lo que hay */ }
  b._listo = true; b._cargando = false;
  if (!lec.idx.has(id) && !lec.extra.has(id)) lec.extra.set(id, b);
  if (hoja && hoja.tipo === 'libro' && hoja.id === id) repintarHoja();
}
function hojaAno(ano) {
  const ch = L.desafio(lec.data, ano), libros = ch.books || [], pct = ch.goal ? ch.read / ch.goal : 0, r = L.ritmo(ch, hoy());
  let h = `<div class="c-ano-hoja">${anillo(pct, 132, 13)}<div class="c-ano-centro"><b>${L.fmtNum(ch.read)}</b><span>${ch.goal ? 'de ' + L.plural(ch.goal, 'libro', 'libros') : ch.read === 1 ? 'libro' : 'libros'}</span></div></div>`;
  h += `<h2 class="c-centro">Desafío ${ano}</h2><p class="c-centro">${esc(r ? r.text : 'Sin meta definida')}</p>`;
  h += cifrasHTML(ano, ch.read, true);
  if (libros.length) {
    h += '<div class="c-rejilla-libros">' + libros.map((b) => `<button class="c-estante-item" data-a="lecLibro" data-id="${esc(b.id)}">${portadaHTML(b)}<b>${esc(b.title)}</b>${estrellasL(b.userRating)}</button>`).join('') + '</div>';
    if (libros.length < ch.read) h += `<p class="c-pista c-centro">Se muestran ${L.fmtNum(libros.length)} de ${L.fmtNum(ch.read)} libros.</p>`;
  } else h += `<p class="c-centro">No hay libros registrados en ${ano}.</p>`;
  return h + '<div class="c-pila">' + (ch.url ? `<a class="d-boton d-boton--discreto" href="${esc(ch.url)}" target="_blank" rel="noopener">${ico('enlace', 20)}Ver el desafío en Goodreads</a>` : '') + '<button class="d-boton d-boton--discreto" data-a="cerrar">Cerrar</button></div>';
}

/* ---------- Lecturas: acciones y ajustes ---------- */
const ACC_LEC = {
  lecLibro(el) { const id = el.dataset.id; abrirHoja('libro', { id }); completarLibro(id); },
  lecAno(el) { if (lec.data) abrirHoja('lecAno', { ano: +el.dataset.ano }); },
  lecRecargar() { cargarLecturas(true); },
  lecMas(el) { const d = $('lecDesc'); if (d) d.classList.remove('c-desc--corta'); el.remove(); },
  lecBorrar() { const i = $('qLec'); if (i) { i.value = ''; i.focus(); } buscarLibros(''); },
  lecCancelar() { lbus.activo = false; lbus.q = ''; lbus.res = null; lbus.error = ''; nLec++; clearTimeout(tLec); const i = $('qLec'); if (i) { i.value = ''; i.blur(); } pintarLec(); },
  lecReciente(el) { const i = $('qLec'); if (i) i.value = el.dataset.q; buscarLibros(el.dataset.q, true); },
  lecReintentar() { buscarLibros(lbus.q, true); },
  lecOlvidar() { lbus.recientes = []; guardarLS(LK.recientes, []); pintarLec(); },
};

    `<li class="d-fila c-ajuste-seg"><span class="d-texto"><strong>Skin</strong></span>${seg('skin', [['vidrio', 'Vidrio'], ['tinta', 'Tinta electrónica']])}</li>` +
    `<li class="d-fila c-ajuste-seg"><span class="d-texto"><strong>Tema</strong></span>${seg('tema', [['auto', 'Automático'], ['claro', 'Claro'], ['oscuro', 'Oscuro']])}</li>` +
    (prefs.skin === 'tinta' ? '' : `<li class="d-fila c-ajuste-seg"><span class="d-texto"><strong>Vidrio</strong></span>${seg('vidrio', [['claro', 'Claro'], ['tintado', 'Tintado']])}</li>`) + '</ul>';
  const D = C.ipcOfficial(S, hoy());

    '<p class="c-nota">Si findic.cl no responde, se usa mindicador.cl, que entrega los mismos datos. Los del Banco Central los trae tres veces al día una tarea de GitHub del repositorio indicadores' +

/* ---------- Hojas ---------- */
const SUB = { uf: 'Unidad de fomento, valor diario', dolar: 'Tipo de cambio observado del Banco Central', ipc: 'Índice de Precios al Consumidor, variación', tpm: 'Banco Central de Chile',
  imacec: 'Índice mensual de actividad económica', cobre: 'Cobre refinado en la Bolsa de Metales de Londres, dólares por libra', petroleo: 'Dólares por barril' };
function hojaIndicador(k) {
  const h0 = hoy(), v = C.view(S, k, prefs, h0);

  if (v) {
    let big = '', cap = '';
    if (k === 'uf') { big = C.pesos(v.v); cap = 'hoy'; }
    if (k === 'dolar') { big = C.pesos(v.v); cap = C.fmtDay(v.date, true); }
    if (k === 'ipc') { big = C.pct(v.v); cap = C.fmtMonth(v.date, true) + (v.y12 != null ? ' · 12 meses ' + C.pct(v.y12) : ''); }
    if (k === 'tpm') { big = C.pct(v.v, 2); cap = v.change ? 'desde el ' + C.fmtDay(v.change.date, true) : ''; }
    if (k === 'imacec') {
      if (prefs.imacec === 'm') { big = v.mLast ? C.signed(v.mLast[1], 1, C.PCT) : '—'; cap = v.mLast ? C.fmtMonth(v.mLast[0], true) + ' · respecto del mes anterior' : 'sin dato mensual'; }
      else { big = C.pct(v.v); cap = C.fmtMonth(v.date, true) + ' · en 12 meses'; }
    }
    if (k === 'cobre') { big = C.usd(v.v); cap = C.fmtDay(v.date, true) + ' · por libra'; }

  if (document.visibilityState !== 'visible') return;
  render(); if (hoja) llenarHoja();
  if (Date.now() - ultimaLectura > 30 * 60000) refresh(false);
  releerSiHaceFalta(); revisarPlataformas();
  if (lec.pendiente) {   // vuelve de Goodreads: se relee enseguida y otra vez al minuto (los estantes tardan en cambiar)
    lec.pendiente = 0; cerrarHoja();
    setTimeout(() => cargarLecturas(false, true), 800); setTimeout(() => cargarLecturas(false, true), 60000);
  } else if (llave && ui.tab === 'lecturas' && lecturasViejas()) cargarLecturas();
  buscarVersionNueva();
});
setInterval(() => { if (document.visibilityState === 'visible' && !hoja && ui.tab === 'ajustes') render(); }, 60000);
let verBarra = false;
window.addEventListener('scroll', () => { const v = window.scrollY > 46; if (v !== verBarra) { $('barraSup').classList.toggle('ver', v); verBarra = v; } }, { passive: true });
['gesturestart', 'gesturechange', 'gestureend'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', (e) => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
